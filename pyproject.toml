[project]
name = "mcp-news"
version = "0.1.0"
description = "Self-hosted news aggregation with an MCP server and a profile you can read."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "AGPL-3.0-or-later" }
authors = [{ name = "Raymond J. Payne" }]
keywords = ["news", "rss", "mcp", "aggregator", "self-hosted"]

# Deliberately small. Everything optional is optional.
dependencies = [
  "httpx[http2]>=0.27",
  "pyyaml>=6.0",
  "feedparser>=6.0",
  "trafilatura>=1.12",     # article text extraction
  "python-dateutil>=2.9",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.8",
  "mcp>=1.2",
  "typer>=0.12",
  "jsonschema>=4.23",
]

[project.optional-dependencies]
vectors = ["sqlite-vec>=0.1.6", "numpy>=1.26"]
postgres = ["psycopg[binary,pool]>=3.2"]
qdrant = ["qdrant-client>=1.11"]
dev = ["pytest>=8.3", "pytest-asyncio>=0.24", "ruff>=0.6", "respx>=0.21"]

[project.scripts]
mcpnews = "mcpnews.cli:app"

[project.urls]
Homepage = "https://github.com/RaymondJPayne/mcp-news"
Documentation = "https://github.com/RaymondJPayne/mcp-news/tree/main/docs"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcpnews"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
